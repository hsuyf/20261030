<body>
<section id="authScreen" aria-labelledby="authTitle">
  <div class="auth-card">
    <div class="auth-brand"><span class="brand-mark">日</span><span>日常</span></div>
    <h1 id="authTitle">登入你的工作空間</h1>
    <p class="auth-copy">使用 Google 帳戶登入後，繼續管理你的日常行程。</p>
    <button id="googleSignIn" class="google-signin" type="button"><span class="google-g" aria-hidden="true">G</span>使用 Google 帳戶登入</button>
    <p id="authError" class="auth-error" role="alert" aria-live="polite"></p>
    <div id="authLoading" class="auth-loading" hidden>正在確認登入狀態…</div>
  </div>
</section>
<div id="appRoot" hidden>
<div class="app">
<aside class="sidebar">
  <div class="brand"><span class="brand-mark">日</span>日常 <span style="font-size:11px;color:#9da6a0;font-weight:400">DAYLIGHT</span></div>
  <div class="nav-label">工作空間</div>
  <button class="nav-item active" data-view="calendar"><span class="ico">▦</span>行事曆</button>
  <button class="nav-item" data-view="tasks"><span class="ico">☷</span>待辦事項<span class="count" id="taskCount">4</span></button>
  <button class="nav-item" data-view="projects"><span class="ico">▤</span>專案</button>
  <div class="nav-label" style="margin-top:16px">我的分類 <button id="addTag" style="float:right;color:#98a19c">＋</button></div><div id="tagList"></div>
  <div class="sidebar-bottom"><div class="profile"><div class="avatar" id="profileAvatar">日</div><div id="profileInfo">已登入<small>個人工作空間</small></div><button id="signOut" class="signout-btn" type="button" style="margin-left:auto">登出</button></div></div>
</aside>
<main class="main">
  <header class="topbar"><div class="breadcrumb">個人工作空間　/　<span id="crumb">行事曆</span></div><div class="top-actions"><button class="icon-btn" title="搜尋">⌕</button><button class="icon-btn" title="通知">♧</button><button class="primary" id="newBtn">＋ 新增</button></div></header>
  <div class="title-row"><div><h1 id="pageTitle">一週行程</h1><div class="subtitle" id="dateSubtitle">把重要的事，安排進剛剛好的日常。</div></div><div class="date-nav"><button id="prevWeek">‹</button><strong id="weekLabel">10月 26日 — 11月 1日</strong><button id="nextWeek">›</button></div></div>
  <div class="layout" id="calendarView">
    <section class="card calendar-card"><div class="cal-toolbar"><div class="segmented"><button>日</button><button class="selected">週</button><button>月</button></div><div class="filters"><button class="filter active" data-filter="全部">全部</button><button class="filter" data-filter="工作">工作</button><button class="filter" data-filter="私人">私人</button></div></div>
      <div class="week-wrap"><div class="week" id="weekGrid"></div></div>
    </section>
    <aside class="right"><section class="card side-card"><div class="side-head"><h2>今天要做</h2><button class="text-btn" id="quickAdd">＋ 新增</button></div><div id="taskList"></div><button class="text-btn" style="margin-top:13px" onclick="switchView('tasks')">查看全部待辦 →</button></section>
    <section class="card side-card"><div class="side-head"><h2>進行中的專案</h2><button class="text-btn" onclick="switchView('projects')">全部</button></div><div id="projectList"></div></section></aside>
  </div>
  <div class="layout" id="tasksView" style="display:none;grid-template-columns:minmax(0,1fr) 300px"><section class="card side-card"><div class="side-head"><h2>待辦事項</h2><button class="text-btn" id="taskNew">＋ 新增任務</button></div><div id="allTasks"></div></section><aside class="card side-card"><div class="side-head"><h2>任務小技巧</h2></div><p style="font-size:12px;color:#87918b;line-height:1.8;margin:0">任務可以只勾選完成、安排在某一天，或設定開始與結束時間，直接出現在行事曆中。把任務連結到專案，讓每一步都有方向。</p></aside></div>
  <div class="layout" id="projectsView" style="display:none;grid-template-columns:minmax(0,1fr) 300px"><section class="card side-card"><div class="side-head"><h2>我的專案</h2><button class="text-btn" id="projectNew">＋ 新增專案</button></div><div id="allProjects"></div></section><aside class="card side-card"><div class="side-head"><h2>專案里程碑</h2></div><div id="milestones"></div></aside></div>
</main>
</div>
<nav class="mobile-nav"><button class="active" onclick="switchView('calendar')"><span>▦</span>行事曆</button><button onclick="switchView('tasks')"><span>☷</span>待辦</button><button onclick="switchView('projects')"><span>▤</span>專案</button><button onclick="openModal()"><span>＋</span>新增</button></nav>
<div class="modal-backdrop" id="tagBackdrop"><div class="modal"><div class="modal-head"><h2 id="tagModalTitle">新增分類</h2><button class="close" id="closeTagModal">×</button></div><form id="tagForm"><div class="field"><label>分類名稱</label><input id="tagName" maxlength="24" required placeholder="例如：家庭、健康、靈感" /></div><div class="field"><label>標籤顏色</label><div id="colorChoices" class="color-choices"></div><input id="tagColor" type="color" value="#93a99b" aria-label="自訂顏色" /></div><div class="modal-actions"><button type="button" class="secondary" id="deleteTagBtn" style="display:none;margin-right:auto;color:#a0645e">刪除分類</button><button type="button" class="secondary" id="cancelTag">取消</button><button type="submit" class="primary">儲存</button></div></form></div></div><div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">新增項目</h2><button class="close" id="closeModal">×</button></div><form id="itemForm"><div class="field"><label>項目類型</label><select id="type"><option value="task">待辦任務</option><option value="event">行程（有時間）</option><option value="project">專案</option></select></div><div class="field"><label id="nameLabel">名稱</label><input id="nameInput" required placeholder="例如：整理本週工作計畫" /></div><div class="field-grid" id="dateFields"><div class="field"><label>日期</label><input id="dateInput" type="date" /></div><div class="field" id="timeField"><label>時間</label><input id="timeInput" type="time" value="09:00" /></div></div><div class="field-grid" id="endTimeWrap"><div class="field"><label>結束時間</label><input id="endTimeInput" type="time" value="10:00" /></div><div class="field"><label>分類</label><select id="tagInput"><option>工作</option><option>私人</option><option>學習</option></select></div></div><div class="field" id="tagOnly"><label>分類</label><select id="tagInput2"><option>工作</option><option>私人</option><option>學習</option></select></div><div class="field" id="projectFields" style="display:none"><label>目標日期</label><input id="dueInput" type="date"/><div style="margin-top:12px"><label>專案階段／里程碑（以逗號分隔）</label><input id="milestoneInput" placeholder="規劃,執行,完成" /></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">取消</button><button type="submit" class="primary">儲存</button></div></form></div></div>
</div>

<script>
const date0=new Date(2026,9,30);let weekOffset=0,currentFilter='全部',activeView='calendar';let tags=[{name:'工作',color:'#8da4b1'},{name:'私人',color:'#bf9f98'},{name:'學習',color:'#a59ab5'}];let editingTag=null;let tasks=[{name:'整理本週工作計畫',date:'2026-10-30',tag:'工作',done:false},{name:'回覆設計提案',date:'2026-10-30',tag:'工作',done:false},{name:'買週末食材',date:'2026-10-30',tag:'私人',done:false},{name:'閱讀 20 頁',date:'2026-10-30',tag:'學習',done:true},{name:'寄出會議紀錄',date:'2026-10-31',tag:'工作',done:false}];let events=[{name:'每週團隊同步',date:'2026-10-26',start:'09:00',end:'10:00',tag:'工作'},{name:'專案提案討論',date:'2026-10-27',start:'11:00',end:'12:30',tag:'工作'},{name:'設計深度工作',date:'2026-10-28',start:'09:30',end:'11:30',tag:'工作'},{name:'午餐與朋友',date:'2026-10-29',start:'12:00',end:'13:00',tag:'私人'},{name:'季度回顧',date:'2026-10-30',start:'10:00',end:'11:00',tag:'工作'},{name:'牙醫回診',date:'2026-10-30',start:'14:00',end:'15:00',tag:'私人'},{name:'瑜伽',date:'2026-10-31',start:'09:00',end:'10:00',tag:'私人'},{name:'讀書會',date:'2026-11-01',start:'15:00',end:'16:30',tag:'學習'}];let projects=[{name:'個人品牌網站',due:'2026-11-20',progress:65,next:'完成首頁視覺',milestones:['需求整理','視覺設計','前端製作','正式上線'],done:2},{name:'年度健康計畫',due:'2026-12-31',progress:32,next:'建立每週運動習慣',milestones:['健康檢查','訓練計畫','持續追蹤'],done:1},{name:'日文 N3 準備',due:'2027-02-15',progress:48,next:'完成第 12 課複習',milestones:['單字累積','文法複習','模擬測驗'],done:1}];
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const fmtDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const mondayOf=d=>{let x=new Date(d),delta=(x.getDay()+6)%7;x.setDate(x.getDate()-delta);x.setHours(0,0,0,0);return x};function weekStart(){let d=mondayOf(date0);d.setDate(d.getDate()+weekOffset*7);return d}
function renderTags(){const list=$('#tagList');list.innerHTML=tags.map((t,i)=>`<div class="tag-row"><span class="dot" style="background:${t.color}"></span>${t.name}<button class="tag-edit" aria-label="編輯${t.name}" onclick="editTag(${i})">···</button></div>`).join('');['tagInput','tagInput2'].forEach(id=>{const sel=$('#'+id),prev=sel.value;sel.innerHTML=tags.map(t=>`<option>${t.name}</option>`).join('');if(tags.some(t=>t.name===prev))sel.value=prev});$('.filter[data-filter]:not([data-filter="全部"])').forEach(b=>b.remove());const fs=$('.filters');tags.forEach(t=>{const b=document.createElement('button');b.className='filter'+(currentFilter===t.name?' active':'');b.dataset.filter=t.name;b.textContent=t.name;b.onclick=()=>{currentFilter=t.name;$('.filter').forEach(x=>x.classList.toggle('active',x===b));renderCalendar()};fs.append(b)})}function renderTags(){const list=$('#tagList');list.innerHTML=tags.map((t,i)=>`<div class="tag-row"><span class="dot" style="background:${t.color}"></span>${t.name}<button class="tag-edit" aria-label="編輯${t.name}" onclick="editTag(${i})">···</button></div>`).join('');['tagInput','tagInput2'].forEach(id=>{const sel=$('#'+id),prev=sel.value;sel.innerHTML=tags.map(t=>`<option>${t.name}</option>`).join('');if(tags.some(t=>t.name===prev))sel.value=prev});const fs=$('.filters');$('.filter:not([data-filter="全部"])').forEach(b=>b.remove());tags.forEach(t=>{const b=document.createElement('button');b.className='filter'+(currentFilter===t.name?' active':'');b.dataset.filter=t.name;b.textContent=t.name;b.onclick=()=>{currentFilter=t.name;$('.filter').forEach(x=>x.classList.toggle('active',x===b));renderCalendar()};fs.append(b)})}function renderCalendar(){const start=weekStart(),end=new Date(start);end.setDate(end.getDate()+6);$('#weekLabel').textContent=`${start.getMonth()+1}月 ${start.getDate()}日 — ${end.getMonth()+1}月 ${end.getDate()}日`;let html='<div></div>';const days=[];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);days.push(d);html+=`<div class="day-head ${fmtDate(d)==='2026-10-30'?'today':''}">${['一','二','三','四','五','六','日'][i]}<b>${d.getDate()}</b></div>`}const labels=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];for(let h=0;h<labels.length;h++){html+=`<div class="time-label">${labels[h]}</div>`;for(const d of days){let date=fmtDate(d);let list=events.filter(e=>e.date===date&&(currentFilter==='全部'||e.tag===currentFilter));let inside=list.filter(e=>parseInt(e.start.slice(0,2))===h+8);html+=`<div class="day-col ${date==='2026-10-30'?'today':''}">`;inside.forEach((e,j)=>{let top=(parseInt(e.start.slice(3,5))/60)*56;let duration=(parseInt(e.end.slice(0,2))*60+parseInt(e.end.slice(3,5)))-(parseInt(e.start.slice(0,2))*60+parseInt(e.start.slice(3,5)));let ht=Math.max(38,duration/60*56);let color=e.tag==='私人'?'rose':e.tag==='學習'?'purple':(j%2?'blue':'');html+=`<div class="event ${color}" style="top:${top}px;height:${ht}px" title="${e.start}–${e.end}"><button class="event-delete" onclick="deleteEvent(${events.indexOf(e)});event.stopPropagation()">×</button><b>${e.start} ${e.name}</b>${e.tag}</div>`});html+='</div>'}}$('#weekGrid').innerHTML=html;}
function taskHtml(t,i){return `<div class="task-item"><button class="check ${t.done?'done':''}" onclick="toggleTask(${i})">${t.done?'✓':''}</button><div class="task-text ${t.done?'done':''}">${t.name}<div class="task-meta"><span class="mini-dot ${t.tag==='私人'?'rose':t.tag==='學習'?'':'blue'}"></span>${t.tag} · ${t.date===fmtDate(date0)?'今天':t.date}</div></div><div class="item-actions"><button class="item-action" onclick="deleteTask(${i})">刪除</button></div></div>`}function openTagModal(i=null){editingTag=i;$('#tagModalTitle').textContent=i===null?'新增分類':'編輯分類';$('#tagName').value=i===null?'':tags[i].name;$('#tagColor').value=i===null?'#93a99b':tags[i].color;$('#deleteTagBtn').style.display=i===null?'none':'inline-flex';$('#tagBackdrop').classList.add('open');renderColorChoices()}function closeTagModal(){$('#tagBackdrop').classList.remove('open')}function renderColorChoices(){const colors=['#8da4b1','#bf9f98','#a59ab5','#93a99b','#c3a978','#91aaa6','#cb9f7d','#b1858c','#8197b0','#6f887a'];$('#colorChoices').innerHTML=colors.map(c=>`<button type="button" class="color-choice ${$('#tagColor').value.toLowerCase()===c?'selected':''}" style="--swatch:${c}" data-color="${c}" aria-label="選擇顏色 ${c}"></button>`).join('')}function editTag(i){openTagModal(i)}function deleteTag(i){const name=tags[i].name;if(!confirm(`刪除分類「${name}」？已指派此標籤的行程和待辦會改為未分類。`))return;events.forEach(x=>{if(x.tag===name)x.tag='未分類'});tasks.forEach(x=>{if(x.tag===name)x.tag='未分類'});tags.splice(i,1);if(currentFilter===name)currentFilter='全部';closeTagModal();renderAll();renderTags()}function deleteTask(i){if(confirm("確定刪除待辦？")){tasks.splice(i,1);renderAll()}}function deleteEvent(i){if(confirm("確定刪除行程？")){events.splice(i,1);renderAll()}}function deleteProject(i){if(confirm("確定刪除專案？")){projects.splice(i,1);renderAll()}}function adjustProgress(i){let n=prompt("輸入完成進度 0–100",projects[i].progress);if(n!==null&&n.trim()!==""&&!Number.isNaN(Number(n))){projects[i].progress=Math.max(0,Math.min(100,Number(n)));renderProjects()}}function toggleMilestone(pi,mi){let p=projects[pi];p.done=mi<p.done?mi:Math.min(mi+1,p.milestones.length);p.progress=p.milestones.length?Math.round(p.done/p.milestones.length*100):0;p.next=p.milestones[p.done]||"專案已完成";renderProjects()}function renderTasks(){$('#taskList').innerHTML=tasks.filter(t=>t.date===fmtDate(date0)).slice(0,4).map(t=>taskHtml(t,tasks.indexOf(t))).join('')||'<div class="empty">今天沒有待辦，享受片刻空白吧。</div>';$('#allTasks').innerHTML=tasks.map((t,i)=>taskHtml(t,i)).join('');$('#taskCount').textContent=tasks.filter(t=>!t.done).length}
function projectHtml(p){return `<div class="project"><div class="project-top"><strong>${p.name}</strong><span class="project-date">${p.due} 前</span><button class="item-action" onclick="deleteProject(${projects.indexOf(p)})">刪除</button></div><div class="progress" title="點此調整完成進度" onclick="adjustProgress(${projects.indexOf(p)})"><span style="width:${p.progress}%"></span></div><div class="milestone">${p.progress}%　·　下一步：${p.next}</div></div>`}function renderProjects(){$('#projectList').innerHTML=projects.slice(0,3).map(projectHtml).join('');$('#allProjects').innerHTML=projects.map(projectHtml).join('');$('#milestones').innerHTML=projects.map(p=>`<div class="project"><div style="font-size:12px;font-weight:600">${p.name}</div>${p.milestones.map((m,i)=>`<button class="milestone-toggle ${i<p.done?'complete':''}" onclick="toggleMilestone(${projects.indexOf(p)},${i})"><span>${i<p.done?'✓':'○'}</span>${m}</button>`).join('')}<div class="project-progress-label">${p.progress}% 已完成</div></div>`).join('')}
function switchView(v){activeView=v;$('#calendarView').style.display=v==='calendar'?'grid':'none';$('#tasksView').style.display=v==='tasks'?'grid':'none';$('#projectsView').style.display=v==='projects'?'grid':'none';$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#crumb').textContent=v==='calendar'?'行事曆':v==='tasks'?'待辦事項':'專案';$('#pageTitle').textContent=v==='calendar'?'一週行程':v==='tasks'?'待辦事項':'專案追蹤';$('#dateSubtitle').textContent=v==='calendar'?'把重要的事，安排進剛剛好的日常。':v==='tasks'?'收集每件待辦，依照節奏一步步完成。':'把長期目標拆解成清楚的下一步。';$('.date-nav').style.visibility=v==='calendar'?'visible':'hidden';renderTasks();}function toggleTask(i){tasks[i].done=!tasks[i].done;renderTasks()}
function openModal(type){$('#modalBackdrop').classList.add('open');$('#type').value=type||'task';$('#dateInput').value=fmtDate(date0);updateModalType()}function closeModal(){$('#modalBackdrop').classList.remove('open')}function updateModalType(){let t=$('#type').value,isP=t==='project',isE=t==='event';$('#dateFields').style.display=isP?'none':'grid';$('#timeField').style.display=isE?'block':'none';$('#endTimeWrap').style.display=isE?'grid':'none';$('#tagOnly').style.display=isP||isE?'none':'block';$('#projectFields').style.display=isP?'block':'none';$('#nameLabel').textContent=isP?'專案名稱':'名稱'}$('#type').onchange=updateModalType;$('#newBtn').onclick=()=>openModal(activeView==='projects'?'project':'task');$('#quickAdd').onclick=$('#taskNew').onclick=()=>openModal('task');$('#projectNew').onclick=()=>openModal('project');$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};$('#itemForm').onsubmit=e=>{e.preventDefault();let t=$('#type').value,name=$('#nameInput').value.trim();if(t==='project'){let m=$('#milestoneInput').value.split(',').map(x=>x.trim()).filter(Boolean);projects.unshift({name,due:$('#dueInput').value||'2026-12-31',progress:0,next:m[0]||'設定下一步任務',milestones:m.length?m:['規劃','執行','完成'],done:0})}else if(t==='event'){events.push({name,date:$('#dateInput').value||fmtDate(date0),start:$('#timeInput').value,end:$('#endTimeInput').value,tag:$('#tagInput').value})}else{tasks.unshift({name,date:$('#dateInput').value||fmtDate(date0),tag:$('#tagInput2').value,done:false})}renderAll();closeModal();e.target.reset()};function renderAll(){renderTags();renderCalendar();renderTasks();renderProjects()}
$('#colorChoices').addEventListener('click',e=>{const swatch=e.target.closest('button[data-color]');if(!swatch)return;e.preventDefault();$('#tagColor').value=swatch.dataset.color;$('#colorChoices').querySelectorAll('.color-choice').forEach(b=>b.classList.toggle('selected',b===swatch))});$('#colorChoices').addEventListener('pointerdown',e=>e.stopPropagation());$('#addTag').onclick=()=>openTagModal();$('#closeTagModal').onclick=$('#cancelTag').onclick=closeTagModal;$('#tagBackdrop').onclick=e=>{if(e.target.id==='tagBackdrop')closeTagModal()};$('#tagColor').oninput=renderColorChoices;$('#tagForm').onsubmit=e=>{e.preventDefault();const name=$('#tagName').value.trim();if(!name)return;if(tags.some((t,i)=>t.name===name&&i!==editingTag)){alert('此分類名稱已存在');return}const tag={name,color:$('#tagColor').value};if(editingTag===null)tags.push(tag);else{const old=tags[editingTag].name;tags[editingTag]=tag;events.forEach(x=>{if(x.tag===old)x.tag=name});tasks.forEach(x=>{if(x.tag===old)x.tag=name});if(currentFilter===old)currentFilter=name}closeTagModal();renderAll()};$('#deleteTagBtn').onclick=()=>{if(editingTag!==null)deleteTag(editingTag)};$('#prevWeek').onclick=()=>{weekOffset--;renderCalendar()};$('#nextWeek').onclick=()=>{weekOffset++;renderCalendar()};$('.filter').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;$('.filter').forEach(x=>x.classList.toggle('active',x===b));renderCalendar()});$$('.nav-item').forEach(b=>b.onclick=()=>switchView(b.dataset.view));const dragSurface=$('.week-wrap');let dragging=false,startX=0,startY=0,scrollX=0,scrollY=0;dragSurface.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('#tagBackdrop'))return;dragging=true;startX=e.clientX;startY=e.clientY;scrollX=dragSurface.scrollLeft;scrollY=dragSurface.scrollTop;dragSurface.classList.add('dragging');dragSurface.setPointerCapture(e.pointerId)});dragSurface.addEventListener('pointermove',e=>{if(!dragging)return;dragSurface.scrollLeft=scrollX-(e.clientX-startX);dragSurface.scrollTop=scrollY-(e.clientY-startY)});const stopDrag=()=>{dragging=false;dragSurface.classList.remove('dragging')};dragSurface.addEventListener('pointerup',stopDrag);dragSurface.addEventListener('pointercancel',stopDrag);$('.segmented button').forEach(b=>b.onclick=()=>{$$('.segmented button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(b.textContent==='日')alert('日視圖：此原型目前以週視圖呈現完整排程。');if(b.textContent==='月')alert('月視圖：此原型目前以週視圖呈現完整排程。')});renderAll();renderTags();
</script>
